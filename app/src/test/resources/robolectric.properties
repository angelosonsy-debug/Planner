# compileSdk=35 (Android 15) outpaces Robolectric 4.13's bundled "android-all"
# jars, so its default SDK auto-detection throws in DefaultSdkPicker with
# "compileSdk 35 not supported". Pinning to API 34 (which 4.13 does support)
# runs every Robolectric test in this module against it instead, independent
# of the module's actual compileSdk/targetSdk.
sdk=34
